<!DOCTYPE html>
<html>
<head>
    <title>Survey Results</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <h1>Survey Results</h1>
    <div>
        <canvas id="graph"></canvas>
    </div>
    <script>
        const graphData = {{ graph_data | tojson }};
        const labels = graphData.map(row => row.period);
        const datasets = [];
        const questionTexts = [...new Set(graphData.map(row => row.question_text))];
        questionTexts.forEach((questionText) => {
            const questionData = graphData.filter(row => row.question_text === questionText);
            const data = questionData.map(row => row.answer);
            datasets.push({
                label: questionText,
                data: data,
                backgroundColor: getRandomColor(),
                borderColor: getRandomColor(),
                borderWidth: 1
            });
        });

        const ctx = document.getElementById('graph').getContext('2d');
        const chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labels,
                datasets: datasets
            },
            options: {
                scales: {
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });

        function getRandomColor() {
            const letters = '0123456789ABCDEF';
            let color = '#';
            for (let i = 0; i < 6; i++) {
                color += letters[Math.floor(Math.random() * 16)];
            }
            return color;
        }
    </script>
</body>
</html>
